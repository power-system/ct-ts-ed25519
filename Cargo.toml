[package]
name = "ct-ts-ed25519"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"

description = "FROST(Ed25519, SHA-512) ciphersuite for ct-ts"
license = "MIT OR Apache-2.0"
repository = "https://github.com/power-system/ct-ts-ed25519"
readme = "README.md"
keywords = ["frost", "threshold", "ed25519", "cryptography"]
categories = ["cryptography"]

[dependencies]
ct-ed25519 = { version = "0.0.3", default-features = false, features = ["zeroize"] }
ct-ts = { version = "0.0.2", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
subtle = { version = "2.6.1", default-features = false }

[dev-dependencies]
hex = "0.4.3"
rand = { version = "0.10.4", features = ["std"] }
